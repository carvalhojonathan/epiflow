{% extends 'base.html' %}

{% block title %}{{ titulo }} - EPI Flow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold text-dark">
                    <i class="bi bi-person-fill-gear me-2 text-secondary"></i>{{ titulo }}
                </h4>
                <a href="{% url 'colaboradores:listar' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Ver Lista
                </a>
            </div>
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.nome.id_for_label }}" class="form-label fw-semibold">{{ form.nome.label }}
                            *</label>
                        {{ form.nome }}
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="{{ form.cpf.id_for_label }}" class="form-label fw-semibold">{{ form.cpf.label }}
                                *</label>
                            {{ form.cpf }}
                        </div>
                        <div class="col-md-6">
                            <label for="{{ form.matricula.id_for_label }}" class="form-label fw-semibold">
                                {{ form.matricula.label }} *</label>
                            {{ form.matricula }}
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="{{ form.funcao.id_for_label }}" class="form-label fw-semibold">
                                {{ form.funcao.label }} *</label>
                            {{ form.funcao }}
                        </div>
                        <div class="col-md-6">
                            <label for="{{ form.telefone.id_for_label }}" class="form-label fw-semibold">
                                {{form.telefone.label }} *</label>
                            {{ form.telefone }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label fw-semibold">
                            {{form.email.label}}</label>
                        {{ form.email }}
                    </div>

                    <div class="form-check form-switch mb-4">
                        {{ form.ativo }}
                        <label class="form-check-label fw-semibold" for="{{ form.ativo.id_for_label }}">
                            {{ form.ativo.label }}
                        </label>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="{% url 'colaboradores:listar' %}" class="btn btn-light border px-4">Cancelar</a>
                        <button type="submit" class="btn btn-custom px-4 fw-bold">
                            {{ botao_texto }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
