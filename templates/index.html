{% extends 'base.html' %}

{% block title %}Início - EPI Flow{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-5 text-center">
        <div class="mb-3 text-secondary display-5">
            <i class="bi bi-cone-striped text-warning"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Painel Inicial</h3>
        <p class="text-muted fs-5 mb-3">Sistema em desenvolvimento</p>

        </p>
        <a href="{% url 'emprestimos:cadastrar' %}" class="btn btn-custom px-4 fw-bold shadow-sm">
