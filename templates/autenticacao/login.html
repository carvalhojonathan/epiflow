{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EPI Flow</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Separado da Página de Login -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="brand-logo-row">
                <img src="{% static 'img/logo-icone.png' %}" alt="Ícone EPI Flow" class="brand-logo-icon">
                <img src="{% static 'img/logo-texto.png' %}" alt="EPI Flow" class="brand-logo-text">
            </div>
            <p class="brand-subtitle mb-0">Sistema de Gestão e Controle de EPIs</p>
        </div>

        <div class="login-body">
            <!-- Mensagens de Feedback (Alertas) -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show py-2 small shadow-sm"
                role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                    <div>{{ message }}</div>
                </div>
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'autenticacao:login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">

                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                            value="{{ username|default:'' }}" placeholder="Digite seu usuário" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Digite sua senha" required>
                        <button class="btn btn-toggle-password" type="button" id="btnTogglePassword"
                            title="Mostrar ou ocultar senha" tabindex="-1">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary w-100 btn-login d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">EPI Flow &#169; 2026 &bull; Projeto Acadêmico do SENAI</span>
            </div>
        </div>
    </div>
    <!-- Script para Visualizar/Ocultar Senha -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btnToggle = document.getElementById('btnTogglePassword');
            const inputPassword = document.getElementById('password');
            const iconToggle = document.getElementById('togglePasswordIcon');

            if (btnToggle && inputPassword && iconToggle) {
                btnToggle.addEventListener('click', function () {
                    const isPassword = inputPassword.getAttribute('type') === 'password';
                    inputPassword.setAttribute('type', isPassword ? 'text' : 'password');
                    iconToggle.classList.toggle('bi-eye', !isPassword);
                    iconToggle.classList.toggle('bi-eye-slash', isPassword);
                });
            }
        });
    </script>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
